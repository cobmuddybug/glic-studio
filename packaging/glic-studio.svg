<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- glic-studio: a quadtree of blocks with two rows torn sideways -->
  <rect x="4" y="4" width="120" height="120" rx="22" fill="#1b1d23"/>
  <g transform="translate(20 20)">
    <!-- quadtree: one 44px block, smaller ones where detail is -->
    <rect x="0" y="0" width="44" height="44" fill="#3b4cc0"/>
    <rect x="44" y="0" width="22" height="22" fill="#4e98d8"/>
    <rect x="66" y="0" width="22" height="22" fill="#3fbfbf"/>
    <rect x="44" y="22" width="11" height="11" fill="#9ad84c"/>
    <rect x="55" y="22" width="11" height="11" fill="#e8d640"/>
    <rect x="44" y="33" width="11" height="11" fill="#4cd08a"/>
    <rect x="55" y="33" width="11" height="11" fill="#f5a23a"/>
    <rect x="66" y="22" width="22" height="22" fill="#4c72d8"/>
    <rect x="0" y="44" width="22" height="22" fill="#4cd08a"/>
    <rect x="22" y="44" width="22" height="22" fill="#3fbfbf"/>
    <rect x="44" y="44" width="44" height="44" fill="#ee6a32"/>
    <rect x="0" y="66" width="44" height="22" fill="#4e98d8"/>
    <!-- the glitch: two bands displaced, with colour fringes -->
    <rect x="10" y="50" width="78" height="7" fill="#e6194b"/>
    <rect x="-6" y="57" width="78" height="5" fill="#46f0f0"/>
    <rect x="18" y="74" width="70" height="4" fill="#f032e6"/>
  </g>
  <!-- block outlines -->
  <g transform="translate(20 20)" fill="none" stroke="#1b1d23" stroke-width="1.5">
    <path d="M44 0V88M0 44H88M66 0V44M44 22H88M55 22V44M44 33H66M22 44V66M0 66H44"/>
  </g>
</svg>
